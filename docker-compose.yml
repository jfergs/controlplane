version: "3.9"

services:
  controlplane:
    build:
      context: .
    image: controlplane:latest
    ports:
      - "8000:8000"
    environment:
      CONTROLPLANE_TOKEN: ${CONTROLPLANE_TOKEN:?set CONTROLPLANE_TOKEN}
      CONTROLPLANE_SESSION_SECRET: ${CONTROLPLANE_SESSION_SECRET:-change-me}
      CONTROLPLANE_DB_PATH: ${CONTROLPLANE_DB_PATH:-/data/.controlplane.db}
      CONTROLPLANE_ENDPOINT_RETENTION_SEC: ${CONTROLPLANE_ENDPOINT_RETENTION_SEC:-0}
      CONTROLPLANE_RATE_LIMIT: ${CONTROLPLANE_RATE_LIMIT:-100/min}
    volumes:
      - ./data:/data
    restart: unless-stopped
